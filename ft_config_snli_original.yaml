### LoRA Fine-tuning with Original SNLI Data
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
dataset: snli_original_5340
cutoff_len: 512
per_device_train_batch_size: 4
gradient_accumulation_steps: 8
learning_rate: 0.0003
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
logging_steps: 10
save_steps: 500
eval_strategy: "no"
output_dir: output/ft_snli_original_output
report_to: none
bf16: true
trust_remote_code: true
remove_unused_columns: false
model_name_or_path: google/gemma-3-4b-it
template: gemma
